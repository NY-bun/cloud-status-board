<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bunsugi Cloud Service Status</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟢</text></svg>">
<meta http-equiv="refresh" content="300">
<style>
* {
  box-sizing: border-box;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: #0f172a;
  color: #e2e8f0;
  margin: 0;
  padding: clamp(12px, 2.5vw, 32px);
  padding-bottom: clamp(88px, 8vw, 124px);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.wrapper {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
}
.lang-fab {
  position: fixed;
  right: clamp(16px, 2.2vw, 32px);
  bottom: clamp(16px, 2.2vw, 32px);
  z-index: 100;
  display: inline-flex;
  align-items: center;
  gap: clamp(8px, 0.8vw, 12px);
  background: rgba(30, 41, 59, 0.94);
  backdrop-filter: blur(8px);
  border: 1px solid #334155;
  border-radius: 999px;
  padding: clamp(6px, 0.6vw, 10px);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}
.flag-btn {
  width: clamp(40px, 3.6vw, 56px);
  height: clamp(40px, 3.6vw, 56px);
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid transparent;
  background: #1e293b;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0.55;
  transition: all 0.2s ease;
  padding: 0;
}
.flag-btn:hover {
  opacity: 0.9;
  transform: scale(1.06);
}
.flag-btn.active {
  opacity: 1;
  border-color: #38bdf8;
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.3);
  transform: scale(1.06);
}
.flag-btn svg {
  width: 100%;
  height: 100%;
  display: block;
}
.container {
  background: #1e293b;
  border: 1px solid #334155;
  padding: clamp(20px, 3.2vw, 48px);
  border-radius: clamp(14px, 1.5vw, 24px);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
}
h1 {
  font-size: clamp(20px, 2.6vw, 44px);
  margin-top: 0;
  margin-bottom: clamp(16px, 2.2vw, 28px);
  color: #f8fafc;
  border-bottom: 1px solid #334155;
  padding-bottom: clamp(12px, 1.5vw, 22px);
  text-align: center;
  letter-spacing: 0.5px;
}
.info-bar {
  display: none;
}
@media (min-width: 900px) {
  .info-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: clamp(12px, 1.6vw, 24px);
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid #334155;
    border-radius: clamp(10px, 1vw, 16px);
    padding: clamp(14px, 1.5vw, 24px) clamp(20px, 2.2vw, 32px);
    margin-bottom: clamp(18px, 2.2vw, 30px);
  }
}
.datetime-group {
  display: flex;
  align-items: baseline;
  gap: clamp(14px, 1.6vw, 28px);
}
.date-text {
  font-size: clamp(18px, 2.0vw, 36px);
  font-weight: 600;
  color: #cbd5e1;
}
.clock-text {
  font-size: clamp(28px, 3.2vw, 56px);
  font-weight: 700;
  color: #f8fafc;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.03em;
}
.weather-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: clamp(10px, 1.3vw, 20px);
}
.weather-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 50px;
  padding: clamp(6px, 0.6vw, 10px) clamp(12px, 1.2vw, 18px);
  font-size: clamp(14px, 1.3vw, 22px);
  font-weight: 600;
  color: #f1f5f9;
  font-variant-numeric: tabular-nums;
}
.weather-label {
  color: #94a3b8;
  font-size: 0.85em;
  font-weight: 500;
}
.banner {
  padding: clamp(14px, 1.8vw, 26px);
  border-radius: clamp(10px, 1vw, 16px);
  font-size: clamp(15px, 1.7vw, 28px);
  font-weight: bold;
  text-align: center;
  margin-bottom: clamp(20px, 2.5vw, 36px);
  border: 1px solid transparent;
}
.banner.success {
  background-color: rgba(16, 185, 129, 0.14);
  color: #6ee7b7;
  border-color: rgba(16, 185, 129, 0.35);
}
.banner.danger {
  background-color: rgba(239, 68, 68, 0.15);
  color: #fca5a5;
  border-color: rgba(239, 68, 68, 0.35);
}
.service-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  grid-template-columns: 1fr;
  gap: clamp(10px, 1.4vw, 20px);
}
@media (min-width: 900px) {
  .service-list {
    grid-template-columns: repeat(2, 1fr);
  }
}
.service-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background: rgba(15, 23, 42, 0.55);
  border: 1px solid #334155;
  border-radius: clamp(10px, 1vw, 16px);
  padding: clamp(14px, 1.8vw, 26px) clamp(16px, 2.2vw, 32px);
}
.service-name {
  font-weight: 600;
  font-size: clamp(15px, 1.6vw, 26px);
  color: #f1f5f9;
  line-height: 1.3;
}
.badge-link {
  text-decoration: none;
  flex-shrink: 0;
}
.badge {
  display: inline-block;
  padding: clamp(7px, 0.9vw, 14px) clamp(14px, 1.6vw, 26px);
  border-radius: 50px;
  font-size: clamp(13px, 1.3vw, 22px);
  font-weight: bold;
  white-space: nowrap;
  transition: opacity 0.2s, transform 0.15s;
}
.badge:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}
.badge.success {
  background-color: #10b981;
  color: #052e16;
}
.badge.danger {
  background-color: #ef4444;
  color: #ffffff;
}
.footer {
  margin-top: clamp(20px, 2.5vw, 36px);
  font-size: clamp(12px, 1.1vw, 18px);
  color: #94a3b8;
  text-align: center;
  line-height: 1.7;
}
</style>
</head>
<body>
<div class="wrapper">
  <div class="container">
    <h1 id="title"></h1>
    <div class="info-bar" id="info-bar">
      <div class="datetime-group">
        <span class="date-text" id="date-text"></span>
        <span class="clock-text" id="clock-text"></span>
      </div>
      <div class="weather-group">
        <span class="weather-pill"><span id="weather-icon"></span><span id="weather-cond"></span></span>
        <span class="weather-pill"><span class="weather-label" id="temp-label"></span><span id="weather-temp"></span></span>
        <span class="weather-pill"><span class="weather-label" id="precip-label"></span><span id="weather-precip"></span></span>
      </div>
    </div>
    <div id="banner" class="banner"></div>
    <ul class="service-list" id="service-list"></ul>
    <div class="footer">
      <span id="footer-text"></span>: 2026-11-28 17:25:58 (JST)<br>
      <span id="footer-note"></span>
    </div>
  </div>
</div>

<div class="lang-fab" id="lang-fab" role="group" aria-label="Language switcher">
  <button type="button" class="flag-btn" id="btn-ja" onclick="setLanguage('ja')" aria-label="日本語" title="日本語">
    <svg viewBox="0 0 36 36" width="100%" height="100%" aria-hidden="true">
  <rect width="36" height="36" fill="#ffffff"/>
  <circle cx="18" cy="18" r="7.5" fill="#bc002d"/>
</svg>
  </button>
  <button type="button" class="flag-btn" id="btn-en" onclick="setLanguage('en')" aria-label="English" title="English">
    <svg viewBox="0 0 36 36" width="100%" height="100%" aria-hidden="true">
  <rect width="36" height="36" fill="#ffffff"/>
  <rect y="0" width="36" height="2.8" fill="#b22234"/>
  <rect y="5.5" width="36" height="2.8" fill="#b22234"/>
  <rect y="11.1" width="36" height="2.8" fill="#b22234"/>
  <rect y="16.6" width="36" height="2.8" fill="#b22234"/>
  <rect y="22.2" width="36" height="2.8" fill="#b22234"/>
  <rect y="27.7" width="36" height="2.8" fill="#b22234"/>
  <rect y="33.2" width="36" height="2.8" fill="#b22234"/>
  <rect x="0" y="0" width="18" height="19.4" fill="#3c3b6e"/>
</svg>
  </button>
</div>
<script>
const allHealthy = true;
const services = [{"name": "Outlook / Microsoft 365", "status": "ok", "url": "https://status.office365.com/"}, {"name": "BLEND", "status": "ok", "url": "https://status.motivationworks.co.jp/"}, {"name": "ロイロノート", "status": "ok", "url": "https://status.loilonote.app/ja"}, {"name": "Canva", "status": "ok", "url": "https://www.canvastatus.com/"}, {"name": "Zoom", "status": "ok", "url": "https://www.zoomstatus.com/"}, {"name": "L-Gate", "status": "ok", "url": "https://l-gate-status.info/"}];
const weather = {"available": true, "icon": "⛅", "ja": "一部くもり", "en": "Partly cloudy", "temp": "17.0°C", "precip": "0%"};
let currentLang = "ja";

const dict = {
  ja: {
    title: "文杉クラウドサービス稼働状況",
    bannerSuccess: "すべてのサービスは正常に稼働しています",
    bannerDanger: "一部のサービスに異常・接続エラーを検知しています",
    statusOk: "正常稼働中",
    statusError: "接続エラー",
    footerText: "最終確認日時",
    footerNote: "※このページは10分おきに自動更新されます",
    tempLabel: "気温",
    precipLabel: "降水確率",
    weekdays: ["日", "月", "火", "水", "木", "金", "土"]
  },
  en: {
    title: "Bunsugi Cloud Service Status",
    bannerSuccess: "All services are operating normally",
    bannerDanger: "Issues or connection errors detected",
    statusOk: "Operational",
    statusError: "Connection Error",
    footerText: "Last checked",
    footerNote: "*This page automatically refreshes every 10 minutes",
    tempLabel: "Temp",
    precipLabel: "Precip",
    weekdays: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
  }
};

function updateDateTime() {
  const now = new Date();
  const t = dict[currentLang] || dict.en;
  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const d = now.getDate();
  const w = t.weekdays[now.getDay()];
  const dateEl = document.getElementById("date-text");
  const clockEl = document.getElementById("clock-text");
  if (dateEl) {
    dateEl.innerText = currentLang === "ja"
      ? (y + "年" + m + "月" + d + "日 (" + w + ")")
      : (w + ", " + now.toLocaleString("en-US", { month: "short" }) + " " + d + ", " + y);
  }
  if (clockEl) {
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    const ss = String(now.getSeconds()).padStart(2, "0");
    clockEl.innerText = hh + ":" + mm + ":" + ss;
  }
}

function updateWeather() {
  const t = dict[currentLang] || dict.en;
  document.getElementById("weather-icon").innerText = weather.icon || "🌡️";
  document.getElementById("weather-cond").innerText = currentLang === "ja" ? weather.ja : weather.en;
  document.getElementById("temp-label").innerText = t.tempLabel;
  document.getElementById("weather-temp").innerText = weather.temp;
  document.getElementById("precip-label").innerText = t.precipLabel;
  document.getElementById("weather-precip").innerText = weather.precip;
}

function setLanguage(lang) {
  currentLang = (lang === "ja" || lang === "en") ? lang : "en";
  document.getElementById("btn-ja").classList.toggle("active", currentLang === "ja");
  document.getElementById("btn-en").classList.toggle("active", currentLang === "en");
  const t = dict[currentLang];
  document.getElementById("title").innerText = t.title;
  updateDateTime();
  updateWeather();
  const banner = document.getElementById("banner");
  banner.className = "banner " + (allHealthy ? "success" : "danger");
  banner.innerText = allHealthy ? t.bannerSuccess : t.bannerDanger;
  document.getElementById("footer-text").innerText = t.footerText;
  document.getElementById("footer-note").innerText = t.footerNote;
  const list = document.getElementById("service-list");
  list.innerHTML = "";
  services.forEach(s => {
    const isOk = s.status === "ok";
    const badgeClass = isOk ? "success" : "danger";
    const statusText = isOk ? t.statusOk : t.statusError;
    let displayName = s.name;
    if (currentLang === "en" && displayName === "ロイロノート") {
      displayName = "LoiLoNote";
    }
    const li = document.createElement("li");
    li.className = "service-item";
    li.innerHTML = '<span class="service-name">' + displayName + '</span><a href="' + s.url + '" target="_blank" rel="noopener noreferrer" class="badge-link"><span class="badge ' + badgeClass + '">' + statusText + '</span></a>';
    list.appendChild(li);
  });
}

const userLang = navigator.language || navigator.userLanguage;
const initialLang = userLang.startsWith("ja") ? "ja" : "en";
setLanguage(initialLang);
setInterval(updateDateTime, 1000);
</script>
</body>
</html>
