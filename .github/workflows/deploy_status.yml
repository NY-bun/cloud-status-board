name: Deploy Cloud Status Page

on:
  # 手動でも実行可能にする
  workflow_dispatch:

# GitHub Pagesへのデプロイ権限とリポジトリ書き込み権限を設定
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (pytz)
        run: pip install pytz

      - name: Run status check script
        run: python check_status.py

      # 毎回必ずタイムスタンプを更新して強制的にコミット・プッシュする
      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 差分がなくても必ず更新されるファイルを作成
          date -u +"%Y-%m-%d %H:%M:%SZ" > last_updated.txt
          
          git add -A
          git commit -m "Update status page [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
