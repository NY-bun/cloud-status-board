name: Deploy Cloud Status Page

on:
  # 混雑する0, 15, 30, 45分を避け、2, 17, 32, 47分にずらして15分おきに実行
  schedule:
    - cron: '2,17,32,47 * * * *'
  # 手動でも実行可能にする
  workflow_dispatch:

# GitHub Pagesへのデプロイ権限とリポジトリ書き込み権限を設定
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (pytz)
        run: pip install pytz

      - name: Run status check script
        run: python check_status.py

      # ステータス変更をGitに記録（履歴を残したい場合。不要ならこのステップ自体を削除してもOK）
      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || git commit -m "Update status page [skip ci]"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
